<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN Panel</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#64748b;--line:#dbe3ec;--acc:#0b6e6e;--accbg:#d9f0ee;--bad:#c2410c;--badbg:#fde8dc;--ok:#15803d;--okbg:#dcf5e4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b2d;--card:#172742;--ink:#e8eef7;--mute:#94a3b8;--line:#27395a;--acc:#4fd1c5;--accbg:#12353a;--bad:#fb923c;--badbg:#3a2415;--ok:#4ade80;--okbg:#12361f}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px}
.box h1{margin:0 0 4px;font-size:24px}
.box p{margin:0 0 20px;color:var(--mute);font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#06201e}}
.btn.full{width:100%;margin-top:18px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.del{background:var(--badbg);color:var(--bad)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:18px}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){nav button.on{color:#06201e}}
main{padding:6px 16px 40px;max-width:980px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat span{font-size:13px;color:var(--mute)}
.stat strong{display:block;font-size:26px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.card h2{margin:0 0 10px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>div{flex:1 1 130px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;color:var(--mute);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:5px;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.srv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.srv:last-child{border:0}
.srv small{color:var(--mute);display:block}
.cfg{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:12px;word-break:break-all;margin-top:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px}
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login">
  <div class="box">
    <h1>VPN Panel</h1>
    <p>Admin hasabyňyz bilen giriň</p>
    <label for="u">Ulanyjy ady</label>
    <input id="u" autocomplete="username">
    <label for="p">Parol</label>
    <input id="p" type="password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn full" id="go">Girmek</button>
  </div>
</section>

<!-- PANEL -->
<div id="app" class="hide">
  <header><b>VPN Panel</b><button class="btn ghost sm" id="out">Çykmak</button></header>
  <nav id="nav">
    <button data-t="dash" class="on">Esasy</button>
    <button data-t="users">Ulanyjylar</button>
    <button data-t="servers">Serwerler</button>
  </nav>
  <main>
    <div id="dash">
      <div class="stats" id="stats"></div>
      <div class="card"><h2>Soňky goşulanlar</h2><div class="scroll"><table id="recent"></table></div></div>
    </div>

    <div id="users" class="hide">
      <div class="card">
        <h2>Täze ulanyjy</h2>
        <div class="row">
          <div><label for="nu">Ady</label><input id="nu" placeholder="mysal: ali01"></div>
          <div><label for="nd">Möhleti (gün)</label><input id="nd" type="number" value="30" min="1"></div>
          <div><label for="ng">Traffic (GB)</label><input id="ng" type="number" value="50" min="1"></div>
          <div><button class="btn" id="add">Goşmak</button></div>
        </div>
      </div>
      <div class="card"><h2>Ulanyjylar</h2><div class="scroll"><table id="ut"></table></div></div>
      <div class="card hide" id="cfgc"><h2>Subscription link</h2><div class="cfg" id="cfg"></div>
        <button class="btn sm ghost" id="copy" style="margin-top:10px">Göçürmek</button></div>
    </div>

    <div id="servers" class="hide">
      <div class="card"><h2>Serwerler</h2><div id="sl"></div></div>
    </div>
  </main>
</div>
<div class="toast hide" id="toast"></div>

<script>
/* ===== SAZLAMALAR (soň üýtgediň) ===== */
var ADMIN_USER = "admin";
var ADMIN_PASS = "1234";           // DEMO: öňünden üýtgediň!
var API_URL = "";                  // Soň serwer API adresi (boş = demo režim)
var DOMAIN = "panel.example.com";  // Soň öz domeniňiz

/* ===== DEMO MAGLUMAT ===== */
var servers = [
  {n:"Aşgabat-1", ip:"203.0.113.10", on:true,  load:42},
  {n:"Stambul-1", ip:"203.0.113.22", on:true,  load:67},
  {n:"Frankfurt-1", ip:"203.0.113.35", on:false, load:0}
];
var users = load() || [
  {name:"ali01",  days:24, used:12.4, limit:50,  on:true},
  {name:"maral",  days:8,  used:46.1, limit:50,  on:true},
  {name:"serdar", days:0,  used:20,   limit:100, on:false}
];

function load(){try{return JSON.parse(localStorage.getItem("vp_users"))}catch(e){return null}}
function save(){try{localStorage.setItem("vp_users",JSON.stringify(users))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.remove("hide");setTimeout(function(){t.classList.add("hide")},2000)}

/* ===== LOGIN ===== */
function enter(){$("login").classList.add("hide");$("app").classList.remove("hide");render()}
$("go").onclick=function(){
  if($("u").value===ADMIN_USER && $("p").value===ADMIN_PASS){
    try{sessionStorage.setItem("vp_in","1")}catch(e){}
    enter();
  } else $("err").textContent="Ulanyjy ady ýa-da parol nädogry";
};
$("p").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
$("out").onclick=function(){try{sessionStorage.removeItem("vp_in")}catch(e){} location.reload()};
try{if(sessionStorage.getItem("vp_in"))enter()}catch(e){}

/* ===== TAB ===== */
$("nav").onclick=function(e){
  var t=e.target.dataset.t; if(!t)return;
  ["dash","users","servers"].forEach(function(x){$(x).classList.toggle("hide",x!==t)});
  [].forEach.call($("nav").children,function(b){b.classList.toggle("on",b===e.target)});
};

/* ===== RENDER ===== */
function render(){
  var act=users.filter(function(u){return u.on&&u.days>0}).length;
  var tot=users.reduce(function(a,u){return a+u.used},0).toFixed(1);
  var onl=servers.filter(function(s){return s.on}).length;
  $("stats").innerHTML=
    st("Ulanyjylar",users.length)+st("Işjeň",act)+st("Traffic (GB)",tot)+st("Serwer online",onl+"/"+servers.length);
  $("recent").innerHTML="<tr><th>Ady</th><th>Möhlet</th><th>Ýagdaý</th></tr>"+
    users.slice(-5).reverse().map(function(u){return "<tr><td>"+esc(u.name)+"</td><td>"+u.days+" gün</td><td>"+tag(u)+"</td></tr>"}).join("");
  $("ut").innerHTML="<tr><th>Ady</th><th>Traffic</th><th>Möhlet</th><th>Ýagdaý</th><th></th></tr>"+
    users.map(function(u,i){
      var p=Math.min(100,Math.round(u.used/u.limit*100));
      return "<tr><td>"+esc(u.name)+"</td><td>"+u.used+" / "+u.limit+" GB<div class='bar'><i style='width:"+p+"%'></i></div></td><td>"+u.days+" gün</td><td>"+tag(u)+"</td><td style='white-space:nowrap'><button class='btn sm ghost' data-l='"+i+"'>Link</button> <button class='btn sm del' data-d='"+i+"'>Poz</button></td></tr>";
    }).join("");
  $("sl").innerHTML=servers.map(function(s){
    return "<div class='srv'><div><b>"+esc(s.n)+"</b><small>"+esc(s.ip)+" · ýük "+s.load+"%</small></div><span class='tag "+(s.on?"ok":"bad")+"'>"+(s.on?"Online":"Offline")+"</span></div>";
  }).join("");
}
function st(a,b){return "<div class='stat'><span>"+a+"</span><strong>"+b+"</strong></div>"}
function tag(u){var ok=u.on&&u.days>0;return "<span class='tag "+(ok?"ok":"bad")+"'>"+(ok?"Işjeň":"Gutardy")+"</span>"}

/* ===== ULANYJY GOŞMAK / POZMAK ===== */
$("add").onclick=function(){
  var n=$("nu").value.trim(), d=+$("nd").value, g=+$("ng").value;
  if(!n||d<1||g<1){toast("Ähli ýerleri dolduryň");return}
  if(users.some(function(u){return u.name===n})){toast("Bu at bar");return}
  users.push({name:n,days:d,used:0,limit:g,on:true});
  save();$("nu").value="";render();toast("Goşuldy");
};
$("ut").onclick=function(e){
  var d=e.target.dataset.d,l=e.target.dataset.l;
  if(d!==undefined && confirm("Pozmalymy?")){users.splice(+d,1);save();render();$("cfgc").classList.add("hide")}
  if(l!==undefined){
    var base=API_URL||("https://"+DOMAIN);
    $("cfg").textContent=base+"/sub/"+encodeURIComponent(users[+l].name);
    $("cfgc").classList.remove("hide");
  }
};
$("copy").onclick=function(){
  try{navigator.clipboard.writeText($("cfg").textContent);toast("Göçürildi")}catch(e){toast("Göçürip bilmedi")}
};
</script>
</body>
</html>
